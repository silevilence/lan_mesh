[package]
name = "lan-mesh-tauri"
version = "0.4.0"
edition = "2024"

[lib]
name = "lan_mesh_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lan_mesh_core = { package = "core", path = "../../core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
if-addrs = "0.15.0"
rfd = "0.17.2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2.10.1"
notify-rust = "4.18.0"
tokio = { version = "1.52.3", features = ["fs", "sync", "time"] }
uuid = "1.23.4"
semver = "1.0.28"
zip = "4.6.1"
