[package]
name = "core-ffi"
version = "0.1.0"
edition = "2024"

[lib]
name = "mesh_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
lan_mesh = { package = "core", path = "../core", default-features = false }
jni = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
