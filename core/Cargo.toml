[package]
name = "core"
version = "0.1.0"
edition = "2024"

[features]
default = ["relay"]
relay = []

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.4", features = ["serde", "v4"] }

[[example]]
name = "android_test_relay"
path = "../android-app/acceptance/relay.rs"
required-features = ["relay"]
